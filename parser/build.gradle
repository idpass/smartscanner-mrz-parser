plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    // Namespace replaces the manifest package attribute (required by AGP 7+/8+/9).
    namespace 'org.idpass.smartscanner.mrz.parser'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    testOptions {
        // MrzFormat.get() calls android.util.Log; let JVM unit tests run against the stub.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // MRZ parser logging
    implementation 'org.slf4j:slf4j-android:1.7.36'

    testImplementation 'junit:junit:4.13.2'
}
